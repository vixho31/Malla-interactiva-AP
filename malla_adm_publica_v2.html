<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malla Interactiva — Administración Pública</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── TOKENS ──────────────────────────────────────────────────────────────── */
  :root {
    --bg:       #0f1623;
    --surface:  #1a2234;
    --surface2: #212d42;
    --border:   rgba(255,255,255,0.07);
    --gold:     #e8a020;
    --gold-lt:  #f5c84a;
    --cream:    #eef2f8;
    --gray:     #6b7fa3;
    --white:    #ffffff;
    --green:    #50b88a;
    --red:      #e05c5c;
    --purple:   #9b6ecf;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ─────────────────────────────────────────────────────────────── */
  header {
    background: linear-gradient(90deg,#0f1623,#1a2234);
    border-bottom: 2px solid var(--gold);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }

  header h1 {
    font-family:'DM Serif Display',serif;
    font-size: 1.4rem;
    color: var(--white);
  }
  header h1 span { color: var(--gold); }

  .header-sub {
    font-family:'DM Mono',monospace;
    font-size:.58rem; color:var(--gray);
    letter-spacing:.1em; text-transform:uppercase; margin-top:3px;
  }

  .stats-pills { display:flex; gap:8px; flex-wrap:wrap; }
  .pill {
    font-family:'DM Mono',monospace; font-size:.6rem;
    letter-spacing:.05em; text-transform:uppercase;
    padding:5px 12px; border-radius:20px; border:1px solid;
    white-space:nowrap; transition: all .2s;
  }
  .pill-gold  { border-color:rgba(232,160,32,.4); color:var(--gold-lt); background:rgba(232,160,32,.08); }
  .pill-green { border-color:rgba(80,184,138,.4); color:#7de0b6;        background:rgba(80,184,138,.08); }
  .pill-blue  { border-color:rgba(74,127,203,.4); color:#8ab5e8;        background:rgba(74,127,203,.08); }

  /* ── CONTROLS ────────────────────────────────────────────────────────────── */
  .controls-bar {
    display:flex; align-items:center; gap:10px;
    padding:11px 28px; border-bottom:1px solid var(--border);
    background:var(--bg); flex-wrap:wrap;
  }

  .ctrl-btn {
    font-family:'DM Mono',monospace; font-size:.6rem;
    letter-spacing:.07em; text-transform:uppercase;
    background:var(--surface); border:1px solid var(--border);
    color:var(--gray); padding:6px 13px; border-radius:6px;
    cursor:pointer; transition:all .2s;
  }
  .ctrl-btn:hover { background:var(--surface2); color:var(--cream); border-color:rgba(255,255,255,.15); }
  .ctrl-btn.active { background:rgba(232,160,32,.15); border-color:rgba(232,160,32,.5); color:var(--gold-lt); }

  .ctrl-sep { width:1px; height:18px; background:var(--border); }
  .ctrl-spacer { flex:1; }

  .progress-mini {
    display:flex; align-items:center; gap:8px;
    font-family:'DM Mono',monospace; font-size:.6rem; color:var(--gray);
  }
  .pm-track { width:110px; height:4px; background:rgba(255,255,255,.07); border-radius:2px; overflow:hidden; }
  .pm-fill  { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-lt)); border-radius:2px; transition:width .4s; }
  .pm-pct   { color:var(--gold-lt); font-weight:500; min-width:32px; }

  /* ── MALLA ───────────────────────────────────────────────────────────────── */
  .malla-outer {
    overflow-x: auto;
    padding: 20px 16px 100px;
  }

  .malla-inner {
    min-width: fit-content;
  }

  /* Sem headers */
  .sem-headers {
    display: flex;
    margin-bottom: 8px;
    padding-left: 24px; /* align with area label space */
  }

  .sem-header-cell {
    min-width: 155px;
    flex: 1;
    text-align: center;
    padding: 8px 6px 10px;
    border-bottom: 2px solid;
    margin: 0 4px;
  }

  .sem-num {
    font-family:'DM Serif Display',serif;
    font-size:.95rem; line-height:1;
  }

  .sem-sub {
    font-family:'DM Mono',monospace;
    font-size:.5rem; color:var(--gray);
    letter-spacing:.07em; text-transform:uppercase; margin-top:2px;
  }

  .ciclo-chip {
    display:inline-block;
    font-family:'DM Mono',monospace; font-size:.47rem;
    letter-spacing:.08em; text-transform:uppercase;
    padding:2px 7px; border-radius:10px; margin-bottom:4px;
  }
  .ciclo-1 { background:rgba(74,144,217,.15); color:#7bb5e8; border:1px solid rgba(74,144,217,.3); }
  .ciclo-2 { background:rgba(155,114,207,.15); color:#c4a8ef; border:1px solid rgba(155,114,207,.3); }

  /* Area rows */
  .area-row {
    display: flex;
    margin-bottom: 6px;
    align-items: stretch;
  }

  .area-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-family:'DM Mono',monospace;
    font-size:.5rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--gray);
    padding:6px 4px;
    border-right:2px solid;
    min-width:24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }

  .area-cols {
    display: flex;
    flex: 1;
  }

  .sem-col {
    min-width: 155px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 0 4px;
  }

  /* ── RAMO CARD ───────────────────────────────────────────────────────────── */
  .ramo {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: all .18s;
    position: relative;
    user-select: none;
    min-height: 58px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .ramo:hover:not(.bloqueado) {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    background: var(--surface2);
    border-color: rgba(255,255,255,.18) !important;
  }

  /* Estados */
  .ramo.aprobado {
    opacity: .38;
  }
  .ramo.aprobado .ramo-nombre {
    text-decoration: line-through;
  }
  .ramo.aprobado::after {
    content:'✓';
    position:absolute; top:6px; right:9px;
    font-size:.85rem; color:var(--gold-lt); opacity:.9;
  }

  .ramo.bloqueado {
    opacity: .28;
    filter: grayscale(.6);
    cursor: not-allowed;
  }

  /* Highlight al seleccionar */
  .ramo.selected {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    transform: translateY(-2px);
    box-shadow: 0 0 0 4px rgba(232,160,32,.15);
  }

  .ramo.es-prereq {
    outline: 2px solid var(--green);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(80,184,138,.15);
  }

  .ramo.lo-desbloquea {
    outline: 2px solid var(--purple);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(155,114,207,.15);
  }

  .ramo-sigla {
    font-family:'DM Mono',monospace;
    font-size:.52rem; color:var(--gray);
    letter-spacing:.05em; margin-bottom:3px;
  }

  .ramo-nombre {
    font-size:.7rem; font-weight:600;
    color:var(--cream); line-height:1.3;
  }

  .ramo-bottom {
    display:flex; justify-content:space-between;
    align-items:center; margin-top:5px;
  }

  .ramo-cat {
    font-family:'DM Mono',monospace;
    font-size:.5rem; letter-spacing:.04em;
    text-transform:uppercase;
  }

  .ramo-prereq-count {
    font-family:'DM Mono',monospace;
    font-size:.5rem; color:var(--gray);
  }

  .tag {
    font-family:'DM Mono',monospace; font-size:.48rem;
    letter-spacing:.05em; padding:1px 5px;
    border-radius:3px; text-transform:uppercase;
  }
  .tag-ele { background:rgba(155,114,207,.15); color:#c4a8ef; border:1px solid rgba(155,114,207,.3); }
  .tag-cer { background:rgba(232,160,32,.1);   color:var(--gold-lt); border:1px solid rgba(232,160,32,.3); }

  /* ── PANEL DETALLE ───────────────────────────────────────────────────────── */
  .panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 300px;
    background: var(--surface2);
    border-left: 1px solid rgba(255,255,255,.1);
    padding: 24px 20px;
    z-index: 200;
    transform: translateX(100%);
    transition: transform .25s ease;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel.open { transform: translateX(0); }

  .panel-close {
    position:absolute; top:14px; right:16px;
    background:none; border:none; color:var(--gray);
    font-size:1.1rem; cursor:pointer;
  }
  .panel-close:hover { color:var(--cream); }

  .panel h2 {
    font-family:'DM Serif Display',serif;
    font-size:1rem; color:var(--white);
    line-height:1.3; padding-right:20px;
  }

  .panel-sigla {
    font-family:'DM Mono',monospace;
    font-size:.65rem; color:var(--gray);
    letter-spacing:.08em; text-transform:uppercase;
  }

  .panel-badge {
    display:inline-block;
    font-family:'DM Mono',monospace; font-size:.58rem;
    letter-spacing:.06em; text-transform:uppercase;
    padding:4px 10px; border-radius:6px;
    border:1px solid; margin-top:2px;
  }

  .panel-section { display:flex; flex-direction:column; gap:6px; }

  .panel-section-title {
    font-family:'DM Mono',monospace; font-size:.58rem;
    color:var(--gray); letter-spacing:.1em; text-transform:uppercase;
    border-bottom:1px solid var(--border); padding-bottom:4px;
  }

  .panel-ramo-pill {
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:6px; padding:7px 10px;
    font-size:.7rem; color:var(--cream);
    display:flex; align-items:center; gap:8px;
  }

  .panel-ramo-pill .dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
  }

  .panel-btn {
    margin-top:auto;
    font-family:'DM Mono',monospace; font-size:.65rem;
    letter-spacing:.07em; text-transform:uppercase;
    padding:10px; border-radius:8px; border:none;
    cursor:pointer; font-weight:600; transition:all .2s;
    width:100%;
  }
  .panel-btn-approve {
    background: rgba(80,184,138,.2);
    color:#7de0b6; border:1px solid rgba(80,184,138,.4);
  }
  .panel-btn-approve:hover { background:rgba(80,184,138,.35); }
  .panel-btn-unapprove {
    background:rgba(224,92,92,.15);
    color:#f08080; border:1px solid rgba(224,92,92,.35);
  }
  .panel-btn-unapprove:hover { background:rgba(224,92,92,.28); }

  /* ── LEGEND ──────────────────────────────────────────────────────────────── */
  .legend-bar {
    position:fixed; bottom:0; left:0; right:0;
    background:var(--bg); border-top:1px solid var(--border);
    padding:10px 28px;
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    z-index:50;
  }

  .leg { display:flex; align-items:center; gap:5px; font-family:'DM Mono',monospace; font-size:.57rem; color:var(--gray); }
  .leg-line { width:16px; height:3px; border-radius:2px; }
  .leg-box  { width:14px; height:10px; border-radius:3px; border:1px solid; }

  /* ── TOOLTIP ─────────────────────────────────────────────────────────────── */
  .tooltip {
    position:fixed;
    background:var(--surface2);
    border:1px solid rgba(255,255,255,.12);
    color:var(--cream);
    padding:10px 14px; border-radius:9px;
    font-family:'DM Mono',monospace; font-size:.68rem;
    pointer-events:none; z-index:999;
    opacity:0; transition:opacity .12s;
    max-width:220px; line-height:1.6;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .tooltip.vis { opacity:1; }
  .tooltip strong { color:var(--gold-lt); display:block; margin-bottom:4px; font-family:'Syne',sans-serif; }

  @media(max-width:768px) {
    header { padding:14px 16px; }
    .controls-bar { padding:9px 16px; }
    .malla-outer { padding:14px 6px 100px; }
    .legend-bar { padding:9px 16px; }
    .panel { width:100%; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="h-titulo">Malla Curricular — <span>Administración Pública</span></h1>
    <div class="header-sub" id="h-sub">Cargando datos…</div>
  </div>
  <div class="stats-pills">
    <div class="pill pill-blue"  id="pill-total">—</div>
    <div class="pill pill-green" id="pill-done">0 aprobados</div>
    <div class="pill pill-gold"  id="pill-pct">0%</div>
  </div>
</header>

<div class="controls-bar">
  <button class="ctrl-btn" id="btn-prereq" onclick="togglePrereqMode()">🔗 Ver prerrequisitos</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="aprobarSemestre()">✓ Aprobar semestre actual</button>
  <button class="ctrl-btn" onclick="resetAll()">↺ Reiniciar</button>
  <div class="ctrl-spacer"></div>
  <div class="progress-mini">
    <span>Avance</span>
    <div class="pm-track"><div class="pm-fill" id="pm-fill" style="width:0%"></div></div>
    <span class="pm-pct" id="pm-pct">0%</span>
  </div>
</div>

<div class="malla-outer">
  <div class="malla-inner" id="malla"></div>
</div>

<!-- Panel lateral de detalle -->
<div class="panel" id="panel">
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div>
    <div class="panel-sigla" id="p-sigla"></div>
    <h2 id="p-nombre"></h2>
    <div id="p-badge" class="panel-badge" style="margin-top:6px"></div>
  </div>
  <div class="panel-section" id="p-prereqs-section">
    <div class="panel-section-title">Prerrequisitos</div>
    <div id="p-prereqs"></div>
  </div>
  <div class="panel-section" id="p-desbloquea-section">
    <div class="panel-section-title">Desbloquea</div>
    <div id="p-desbloquea"></div>
  </div>
  <button class="panel-btn" id="p-btn" onclick="toggleDesdePanel()"></button>
</div>

<div class="legend-bar" id="legend-bar"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// ──────────────────────────────────────────────────────────────────────────────
// ESTADO
// ──────────────────────────────────────────────────────────────────────────────
let DATA = null;
let approved = new Set();
let selectedId = null;
let prereqMode = false;

const SEM_COLORS = {
  1:'#4a7fcb',2:'#5b9bd5',3:'#3da876',4:'#50b88a',
  5:'#cf7a3d',6:'#e0915a',7:'#9b6ecf',8:'#7c54b0',
  9:'#c45c8a',10:'#e8a020'
};

// ──────────────────────────────────────────────────────────────────────────────
// CARGA DE DATOS
// ──────────────────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('./data_AP.json');
    DATA = await res.json();
  } catch(e) {
    // Fallback: datos embebidos (por si se abre el HTML sin servidor)
    DATA = FALLBACK_DATA;
  }
  approved = new Set(JSON.parse(localStorage.getItem('malla_ap2_approved') || '[]'));
  buildLegend();
  render();
}

// ──────────────────────────────────────────────────────────────────────────────
// HELPERS
// ──────────────────────────────────────────────────────────────────────────────
function allRamos() {
  const out = [];
  for(let s=1; s<=DATA.semestres; s++) {
    const key = 's'+s;
    (DATA.ramos[key]||[]).forEach(r => {
      out.push({ sigla:r[1], nombre:r[0], cat:r[2], prereqs:r[3]||[], sem:s });
    });
  }
  return out;
}

function getRamo(sigla) {
  return allRamos().find(r => r.sigla === sigla);
}

function getDependientes(sigla) {
  return allRamos().filter(r => r.prereqs.includes(sigla)).map(r => r.sigla);
}

function isUnlocked(ramo) {
  return ramo.prereqs.every(p => approved.has(p));
}

function save() {
  try { localStorage.setItem('malla_ap2_approved', JSON.stringify([...approved])); } catch(e){}
}

// ──────────────────────────────────────────────────────────────────────────────
// STATS
// ──────────────────────────────────────────────────────────────────────────────
function updateStats() {
  const total = allRamos().length;
  const done  = approved.size;
  const pct   = total ? Math.round(done/total*100) : 0;
  document.getElementById('pill-total').textContent  = total + ' ramos';
  document.getElementById('pill-done').textContent   = done  + ' aprobados';
  document.getElementById('pill-pct').textContent    = pct   + '% completado';
  document.getElementById('pm-fill').style.width     = pct + '%';
  document.getElementById('pm-pct').textContent      = pct + '%';

  document.getElementById('h-sub').textContent =
    `${DATA.titulo} · ${DATA.licenciatura}`;
}

// ──────────────────────────────────────────────────────────────────────────────
// LEGEND
// ──────────────────────────────────────────────────────────────────────────────
function buildLegend() {
  const lb = document.getElementById('legend-bar');
  lb.innerHTML = '';
  Object.entries(DATA.categorias).forEach(([k,v]) => {
    const el = document.createElement('div');
    el.className = 'leg';
    el.innerHTML = `<div class="leg-line" style="background:${v.color}"></div>${v.nombre}`;
    lb.appendChild(el);
  });
  // Estado hints
  ['Seleccionado','Prerrequisito','Lo desbloquea','Bloqueado'].forEach((label,i) => {
    const colors = ['rgba(232,160,32,.6)','rgba(80,184,138,.7)','rgba(155,114,207,.7)','rgba(255,255,255,.15)'];
    const el = document.createElement('div');
    el.className = 'leg';
    el.style.marginLeft = i===0 ? '12px' : '0';
    el.innerHTML = `<div class="leg-box" style="background:${colors[i]}20;border-color:${colors[i]}"></div>${label}`;
    lb.appendChild(el);
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// RENDER PRINCIPAL
// ──────────────────────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('malla');
  container.innerHTML = '';

  const AREAS = [
    { key:'disciplinar', label:'Área Disciplinar',  borderColor:'#4a90d9',
      cats: new Set(['GES','POL','INN','CPO','MET_D','DER','TRV']) },
    { key:'basica',      label:'Área Básica',        borderColor:'#7b8fa0',
      cats: new Set(['ECO','BAS','MET']) },
    { key:'electiva',    label:'Área Electiva',      borderColor:'#9b6ecf',
      cats: new Set(['ELE','CER']) }
  ];

  // Asignar área a cada ramo según categoría
  function getArea(cat) {
    if (['ELE','CER'].includes(cat)) return 'electiva';
    if (['ECO','BAS','MET'].includes(cat)) return 'basica';
    return 'disciplinar';
  }

  // ── Sem headers ──────────────────────────────────────────────────────────
  const headersRow = document.createElement('div');
  headersRow.className = 'sem-headers';
  // spacer for area label
  const sp = document.createElement('div');
  sp.style.minWidth = '24px';
  headersRow.appendChild(sp);

  for(let s=1; s<=DATA.semestres; s++) {
    const cell = document.createElement('div');
    cell.className = 'sem-header-cell';
    cell.style.borderColor = SEM_COLORS[s]+'80';
    cell.innerHTML = `
      <div><span class="ciclo-chip ciclo-${s<=8?1:2}">Ciclo ${s<=8?1:2}</span></div>
      <div class="sem-num" style="color:${SEM_COLORS[s]}">${s}°</div>
      <div class="sem-sub">Semestre</div>
    `;
    headersRow.appendChild(cell);
  }
  container.appendChild(headersRow);

  // ── Area rows ─────────────────────────────────────────────────────────────
  AREAS.forEach(area => {
    // Check if this area has any ramos
    const hasRamos = Object.entries(DATA.ramos).some(([,list]) =>
      list.some(r => getArea(r[2]) === area.key)
    );
    if (!hasRamos) return;

    const areaRow = document.createElement('div');
    areaRow.className = 'area-row';

    const aLabel = document.createElement('div');
    aLabel.className = 'area-label';
    aLabel.style.borderColor = area.borderColor;
    aLabel.style.color = area.borderColor + 'cc';
    aLabel.textContent = area.label;
    areaRow.appendChild(aLabel);

    const areaCols = document.createElement('div');
    areaCols.className = 'area-cols';

    for(let s=1; s<=DATA.semestres; s++) {
      const col = document.createElement('div');
      col.className = 'sem-col';

      const ramosS = (DATA.ramos['s'+s]||[]).filter(r => getArea(r[2]) === area.key);

      ramosS.forEach(r => {
        const [nombre, sigla, cat, prereqs] = r;
        const ramo = { nombre, sigla, cat, prereqs: prereqs||[], sem:s };
        const catData = DATA.categorias[cat] || { color:'#7b8fa0', nombre:cat };
        const isApproved = approved.has(sigla);
        const unlocked   = isUnlocked(ramo);
        const isEle = cat === 'ELE';
        const isCer = cat === 'CER';

        const card = document.createElement('div');
        card.className = 'ramo';
        card.dataset.sigla = sigla;

        // Border color = línea
        card.style.borderLeftColor = catData.color;

        // Estado
        if (isApproved) card.classList.add('aprobado');
        else if (!unlocked) card.classList.add('bloqueado');

        // Highlight en modo prereq
        if (prereqMode && selectedId) {
          const sel = getRamo(selectedId);
          if (sel) {
            if (sel.prereqs.includes(sigla)) card.classList.add('es-prereq');
            if (getDependientes(selectedId).includes(sigla)) card.classList.add('lo-desbloquea');
            if (sigla === selectedId) card.classList.add('selected');
          }
        }

        // Prereqs faltantes
        const missingPrereqs = (prereqs||[]).filter(p => !approved.has(p));

        card.innerHTML = `
          <div>
            <div class="ramo-sigla">${sigla}</div>
            <div class="ramo-nombre">${nombre}</div>
          </div>
          <div class="ramo-bottom">
            <span class="ramo-cat" style="color:${catData.color}88">${catData.nombre}</span>
            ${isEle ? '<span class="tag tag-ele">Electivo</span>' : ''}
            ${isCer ? '<span class="tag tag-cer">Certificación</span>' : ''}
            ${prereqs.length && !isApproved && !unlocked
              ? `<span class="ramo-prereq-count">🔒 ${missingPrereqs.length}</span>`
              : ''}
          </div>
        `;

        // Clic
        card.addEventListener('click', () => {
          if (prereqMode) {
            selectedId = selectedId === sigla ? null : sigla;
            render();
            if (selectedId) openPanel(sigla);
            else closePanel();
            return;
          }
          // Toggle aprobado (solo si desbloqueado o ya aprobado)
          if (!unlocked && !isApproved) return;
          if (isApproved) approved.delete(sigla);
          else approved.add(sigla);
          save(); render();
        });

        // Tooltip al hover
        card.addEventListener('mousemove', e => {
          const tip = document.getElementById('tooltip');
          const prereqNames = (prereqs||[]).map(p => getRamo(p)?.nombre || p);
          let html = `<strong>${nombre}</strong>`;
          html += `<div style="color:var(--gray);font-size:.62rem">Semestre ${s} · ${catData.nombre}</div>`;
          if (prereqNames.length)
            html += `<div style="margin-top:5px;color:var(--gray);font-size:.6rem">Prereqs: <span style="color:var(--cream)">${prereqNames.join(', ')}</span></div>`;
          if (!unlocked && !isApproved)
            html += `<div style="color:#e05c5c;font-size:.6rem;margin-top:3px">Falta aprobar ${missingPrereqs.length} prerrequisito(s)</div>`;
          tip.innerHTML = html;
          tip.classList.add('vis');
          tip.style.left = (e.clientX+14)+'px';
          tip.style.top  = (e.clientY-54)+'px';
        });
        card.addEventListener('mouseleave', () => {
          document.getElementById('tooltip').classList.remove('vis');
        });

        col.appendChild(card);
      });

      areaCols.appendChild(col);
    }

    areaRow.appendChild(areaCols);
    container.appendChild(areaRow);
  });

  updateStats();
}

// ──────────────────────────────────────────────────────────────────────────────
// PANEL LATERAL
// ──────────────────────────────────────────────────────────────────────────────
function openPanel(sigla) {
  const ramo = getRamo(sigla);
  if (!ramo) return;
  const catData = DATA.categorias[ramo.cat] || { color:'#7b8fa0', nombre:ramo.cat };

  document.getElementById('p-sigla').textContent = sigla;
  document.getElementById('p-nombre').textContent = ramo.nombre;

  const badge = document.getElementById('p-badge');
  badge.textContent = catData.nombre;
  badge.style.borderColor = catData.color + '80';
  badge.style.color = catData.color;
  badge.style.background = catData.color + '15';

  // Prerrequisitos
  const prereqDiv = document.getElementById('p-prereqs');
  prereqDiv.innerHTML = '';
  if (ramo.prereqs.length === 0) {
    prereqDiv.innerHTML = '<div style="color:var(--gray);font-size:.65rem">Sin prerrequisitos</div>';
  } else {
    ramo.prereqs.forEach(p => {
      const pr = getRamo(p);
      const pcat = DATA.categorias[pr?.cat] || { color:'#7b8fa0' };
      const done = approved.has(p);
      prereqDiv.innerHTML += `
        <div class="panel-ramo-pill" style="opacity:${done?.9:.5}">
          <div class="dot" style="background:${pcat.color}"></div>
          <span>${pr?.nombre || p}</span>
          ${done ? '<span style="color:var(--gold-lt);margin-left:auto">✓</span>' : ''}
        </div>`;
    });
  }

  // Lo que desbloquea
  const deps = getDependientes(sigla);
  const desDiv = document.getElementById('p-desbloquea');
  desDiv.innerHTML = '';
  if (deps.length === 0) {
    desDiv.innerHTML = '<div style="color:var(--gray);font-size:.65rem">Ningún ramo directo</div>';
  } else {
    deps.forEach(d => {
      const dr = getRamo(d);
      const dcat = DATA.categorias[dr?.cat] || { color:'#7b8fa0' };
      desDiv.innerHTML += `
        <div class="panel-ramo-pill">
          <div class="dot" style="background:${dcat.color}"></div>
          <span>${dr?.nombre || d}</span>
        </div>`;
    });
  }

  // Botón
  const btn = document.getElementById('p-btn');
  const isApproved = approved.has(sigla);
  const unlocked = isUnlocked(ramo);
  if (isApproved) {
    btn.textContent = '✕ Marcar como pendiente';
    btn.className = 'panel-btn panel-btn-unapprove';
  } else if (unlocked) {
    btn.textContent = '✓ Marcar como aprobado';
    btn.className = 'panel-btn panel-btn-approve';
  } else {
    btn.textContent = '🔒 Faltan prerrequisitos';
    btn.className = 'panel-btn';
    btn.style.opacity = '.4';
    btn.style.cursor = 'default';
  }

  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  selectedId = null;
  if (prereqMode) render();
}

function toggleDesdePanel() {
  if (!selectedId) return;
  const ramo = getRamo(selectedId);
  if (!ramo) return;
  const isApproved = approved.has(selectedId);
  const unlocked = isUnlocked(ramo);
  if (!isApproved && !unlocked) return;
  if (isApproved) approved.delete(selectedId);
  else approved.add(selectedId);
  save(); render(); openPanel(selectedId);
}

// ──────────────────────────────────────────────────────────────────────────────
// CONTROLES
// ──────────────────────────────────────────────────────────────────────────────
function togglePrereqMode() {
  prereqMode = !prereqMode;
  document.getElementById('btn-prereq').classList.toggle('active', prereqMode);
  if (!prereqMode) { selectedId = null; closePanel(); }
  render();
}

function resetAll() {
  if (!confirm('¿Reiniciar toda la malla?')) return;
  approved.clear(); save(); selectedId=null; closePanel(); render();
}

function aprobarSemestre() {
  for (let s=1; s<=DATA.semestres; s++) {
    const ramos = (DATA.ramos['s'+s]||[]).map(r=>({sigla:r[1],prereqs:r[3]||[]}));
    if (ramos.some(r => !approved.has(r.sigla))) {
      ramos.forEach(r => { if(isUnlocked(r)) approved.add(r.sigla); });
      save(); render(); return;
    }
  }
}

// Click fuera del panel cierra la selección
document.addEventListener('click', e => {
  if (!e.target.closest('.ramo') && !e.target.closest('.panel')) {
    closePanel();
  }
});
