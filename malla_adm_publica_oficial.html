<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malla Curricular — Administración Pública</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1623;
    --surface: #1a2234;
    --surface2: #212d42;
    --border: rgba(255,255,255,0.07);
    --gold: #e8a020;
    --gold-light: #f5c84a;
    --cream: #eef2f8;
    --gray: #6b7fa3;
    --white: #ffffff;

    /* Líneas según malla oficial */
    --gestion:    #4a90d9;
    --polpub:     #50b88a;
    --innovacion: #e0915a;
    --cienpol:    #e8c840;
    --metodologia:#cf7a3d;
    --economia:   #5b9bd5;
    --derecho:    #7c8fa8;
    --transversal:#c45c8a;
    --basica:     #7b8fa0;
    --electiva:   #9b6ecf;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: linear-gradient(90deg, #0f1623 0%, #1a2234 100%);
    border-bottom: 2px solid var(--gold);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.45rem;
    color: var(--white);
  }
  header h1 span { color: var(--gold); }

  .header-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    color: var(--gray);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .stats-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid;
    white-space: nowrap;
  }
  .pill-gold  { border-color: rgba(232,160,32,0.4);  color: var(--gold-light); background: rgba(232,160,32,0.08); }
  .pill-green { border-color: rgba(80,184,138,0.4);  color: #7de0b6;           background: rgba(80,184,138,0.08); }
  .pill-blue  { border-color: rgba(74,127,203,0.4);  color: #8ab5e8;           background: rgba(74,127,203,0.08); }

  /* CONTROLS */
  .controls-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-wrap: wrap;
  }

  .ctrl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--gray);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: var(--surface2); color: var(--cream); border-color: rgba(255,255,255,0.15); }

  .ctrl-spacer { flex: 1; }

  .progress-mini {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    color: var(--gray);
  }
  .pm-track { width: 110px; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
  .pm-fill  { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; transition: width 0.4s; }
  .pm-pct   { color: var(--gold-light); font-weight: 500; min-width: 32px; }

  /* AREA LABELS */
  .area-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    padding: 8px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 2px solid;
    min-width: 28px;
    flex-shrink: 0;
  }

  /* MALLA GRID */
  .malla-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 20px 16px 90px;
    overflow-x: auto;
  }

  .area-block {
    display: flex;
    gap: 0;
    margin-bottom: 6px;
  }

  .area-label-disciplinar { border-color: var(--gestion);  color: var(--gestion); }
  .area-label-basica       { border-color: var(--basica);   color: var(--basica); }
  .area-label-electiva     { border-color: var(--electiva); color: var(--electiva); }

  .sems-grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(148px, 1fr));
    gap: 0;
    flex: 1;
  }

  .sem-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 5px 10px;
    border-right: 1px solid rgba(255,255,255,0.04);
  }

  .sem-col:last-child { border-right: none; }

  /* Semester header — shown only once at top */
  .sem-headers {
    display: grid;
    grid-template-columns: 28px repeat(10, minmax(148px, 1fr));
    margin-bottom: 4px;
    padding: 0 16px;
    min-width: fit-content;
  }

  .sem-header-cell {
    text-align: center;
    padding: 10px 5px 6px;
    border-bottom: 2px solid;
  }

  .sem-num {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    line-height: 1;
  }

  .sem-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    color: var(--gray);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .ciclo-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
    display: inline-block;
  }
  .ciclo-1 { background: rgba(74,144,217,0.15); color: #7bb5e8; border: 1px solid rgba(74,144,217,0.3); }
  .ciclo-2 { background: rgba(155,114,207,0.15); color: #c4a8ef; border: 1px solid rgba(155,114,207,0.3); }

  /* RAMO CARD */
  .ramo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid;
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    user-select: none;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .ramo-card:hover {
    border-color: rgba(255,255,255,0.2) !important;
    border-left-color: inherit !important;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    background: var(--surface2);
  }

  .ramo-card.done {
    opacity: 0.38;
    background: var(--surface);
  }

  .ramo-card.done .ramo-name {
    text-decoration: line-through;
  }

  .ramo-card.done::after {
    content: '✓';
    position: absolute;
    top: 6px; right: 8px;
    font-size: 0.8rem;
    color: var(--gold-light);
    opacity: 0.9;
  }

  .ramo-name {
    font-size: 0.71rem;
    font-weight: 600;
    color: var(--cream);
    line-height: 1.3;
  }

  .ramo-linea {
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
    color: var(--gray);
    margin-top: 5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Electivo / Certificación */
  .ramo-card.electivo { border-left-color: var(--electiva) !important; }
  .ramo-card.certificacion { border-left-color: var(--gold) !important; border-style: dashed !important; }

  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.48rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    margin-top: 4px;
    display: inline-block;
  }
  .tag-electivo { background: rgba(155,114,207,0.15); color: #c4a8ef; border: 1px solid rgba(155,114,207,0.3); }
  .tag-cert { background: rgba(232,160,32,0.1); color: var(--gold-light); border: 1px solid rgba(232,160,32,0.3); }

  /* Empty slot */
  .ramo-empty {
    min-height: 10px;
    border-radius: 6px;
  }

  /* TOOLTIP */
  .tooltip {
    position: fixed;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--cream);
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 230px;
    line-height: 1.6;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip strong { color: var(--gold-light); display: block; margin-bottom: 5px; font-family: 'Syne', sans-serif; font-size: 0.75rem; }
  .tip-row { display: flex; gap: 6px; color: var(--gray); font-size: 0.62rem; }
  .tip-row span { color: var(--cream); }

  /* LEGEND */
  .legend-bar {
    display: flex;
    gap: 14px;
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-wrap: wrap;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 50;
    align-items: center;
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 0.57rem;
    color: var(--gray);
  }

  .leg-line {
    width: 18px; height: 3px;
    border-radius: 2px;
  }

  @media (max-width: 900px) {
    header { padding: 14px 16px; }
    .controls-bar { padding: 10px 16px; }
    .malla-wrapper { padding: 14px 6px 90px; }
    .sem-headers { padding: 0 6px; }
    .legend-bar { padding: 10px 16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Malla Curricular — <span>Administración Pública</span></h1>
    <div class="header-sub">10 semestres · Título: Administrador(a) Público(a) · Licenciado(a) en Gestión Pública</div>
  </div>
  <div class="stats-pills">
    <div class="pill pill-blue" id="pill-total">— ramos</div>
    <div class="pill pill-green" id="pill-done">0 aprobados</div>
    <div class="pill pill-gold" id="pill-avance">0% completado</div>
  </div>
</header>

<div class="controls-bar">
  <button class="ctrl-btn" onclick="resetAll()">↺ Reiniciar todo</button>
  <button class="ctrl-btn" onclick="aprobarHastaSemestre()">✓ Aprobar semestre actual</button>
  <div class="ctrl-spacer"></div>
  <div class="progress-mini">
    <span>Avance</span>
    <div class="pm-track"><div class="pm-fill" id="pm-fill" style="width:0%"></div></div>
    <span class="pm-pct" id="pm-pct">0%</span>
  </div>
</div>

<div class="malla-wrapper" id="malla-wrapper"></div>

<div class="legend-bar">
  <div class="leg-item"><div class="leg-line" style="background:var(--gestion)"></div>Gestión</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--polpub)"></div>Políticas públicas</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--innovacion)"></div>Innovación</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--cienpol)"></div>Ciencia política</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--metodologia)"></div>Metodología</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--economia)"></div>Economía</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--derecho)"></div>Derecho</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--transversal)"></div>Transversal</div>
  <div class="leg-item" style="margin-left:8px"><div style="width:18px;height:10px;border:1px dashed rgba(232,160,32,0.5);border-radius:3px"></div>Certificación</div>
  <div class="leg-item"><div style="width:18px;height:10px;background:rgba(155,114,207,0.15);border:1px solid rgba(155,114,207,0.4);border-radius:3px"></div>Electivo</div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ─── DATOS REALES DE LA MALLA ─────────────────────────────────────────────────
// linea: gestion | polpub | innovacion | cienpol | metodologia | economia | derecho | transversal | basica | electiva
// area: disciplinar | basica | electiva

const MALLA = {
  disciplinar: [
    // [sem, nombre, linea, prereqs (vacío por ahora)]
    [1,  'Administración pública',                        'gestion',     []],
    [1,  'Historia del pensamiento político',             'cienpol',     []],
    [1,  'Ética pública',                                'transversal', []],
    [2,  'Gestión pública',                              'gestion',     []],
    [2,  'Ciencia política I',                           'cienpol',     []],
    [2,  'Enfoque y perspectiva de género',              'transversal', []],
    [3,  'Gobierno y desarrollo regional',               'gestion',     []],
    [3,  'Ciencia política II',                          'cienpol',     []],
    [3,  'Instituciones y procesos políticos chilenos',  'cienpol',     []],
    [3,  'Derecho constitucional',                       'derecho',     []],
    [4,  'Economía del sector público',                  'economia',    []],
    [4,  'Teoría del estado y del gobierno',             'cienpol',     []],
    [4,  'Finanzas públicas',                            'economia',    []],
    [4,  'Gestión de personas',                          'gestion',     []],
    [5,  'Derecho administrativo',                       'derecho',     []],
    [5,  'Sistema político',                             'cienpol',     []],
    [5,  'Contabilidad gubernamental',                   'gestion',     []],
    [6,  'Procedimientos administrativos',               'derecho',     []],
    [6,  'Relaciones internacionales',                   'cienpol',     []],
    [6,  'Planificación y control de gestión pública',   'gestion',     []],
    [7,  'Administración municipal',                     'gestion',     []],
    [7,  'Negociación y toma de decisiones',             'gestion',     []],
    [7,  'Políticas públicas',                           'polpub',      []],
    [7,  'Análisis de datos para la administración pública I', 'metodologia', []],
    [7,  'Laboratorio de innovación',                    'innovacion',  []],
    [8,  'Dirección pública',                            'gestion',     []],
    [8,  'Modernización del estado',                     'gestion',     []],
    [8,  'Evaluación de políticas públicas',             'polpub',      []],
    [8,  'Análisis de datos para la administración pública II','metodologia',[]],
    [8,  'Políticas sociales',                           'polpub',      []],
    [9,  'Compras públicas',                             'gestion',     []],
    [9,  'Sistemas de información y procesos del estado','gestion',     []],
    [9,  'Seminario de titulación I',                    'polpub',      []],
    [10, 'Práctica profesional',                         'gestion',     []],
    [10, 'Seminario de titulación II',                   'polpub',      []],
  ],
  basica: [
    [1,  'Introducción a la economía',                   'economia',    []],
    [1,  'Fundamentos de matemáticas I',                 'basica',      []],
    [1,  'Métodos de investigación en ciencias sociales','metodologia', []],
    [2,  'Macroeconomía',                                'economia',    []],
    [2,  'Fundamentos de matemáticas II',                'basica',      []],
    [2,  'Fundamentos del derecho',                      'derecho',     []],
    [3,  'Contabilidad I',                               'basica',      []],
    [4,  'Métodos y técnicas de investigación cualitativa','metodologia',[]],
    [5,  'Estadística I',                                'metodologia', []],
    [5,  'Métodos y técnicas de investigación cuantitativa','metodologia',[]],
    [6,  'Estadística II',                               'metodologia', []],
  ],
  electiva: [
    [3,  'Electivo 1',      'electiva', [], true, false],
    [4,  'Electivo 2',      'electiva', [], true, false],
    [5,  'Certificación 1', 'electiva', [], false, true],
    [6,  'Electivo 3',      'electiva', [], true, false],
    [6,  'Certificación 2', 'electiva', [], false, true],
    [8,  'Electivo 4',      'electiva', [], true, false],
    [8,  'Certificación 3', 'electiva', [], false, true],
  ]
};

const SEM_COLORS = {
  1:'#4a7fcb', 2:'#5b9bd5', 3:'#3da876', 4:'#50b88a',
  5:'#cf7a3d', 6:'#e0915a', 7:'#9b6ecf', 8:'#7c54b0',
  9:'#c45c8a', 10:'#e8a020'
};

const LINEA_COLORS = {
  gestion:'#4a90d9', polpub:'#50b88a', innovacion:'#e0915a',
  cienpol:'#e8c840', metodologia:'#cf7a3d', economia:'#5b9bd5',
  derecho:'#7c8fa8', transversal:'#c45c8a', basica:'#7b8fa0', electiva:'#9b6ecf'
};

const LINEA_LABELS = {
  gestion:'Gestión', polpub:'Políticas públicas', innovacion:'Innovación',
  cienpol:'Ciencia política', metodologia:'Metodología', economia:'Economía',
  derecho:'Derecho', transversal:'Transversal', basica:'Formación básica', electiva:'Electiva'
};

// Build flat ramo list with unique IDs
let ALL_RAMOS = [];
let idCounter = 0;

function buildRamos() {
  ALL_RAMOS = [];
  idCounter = 0;

  const addArea = (area, list) => {
    list.forEach(r => {
      ALL_RAMOS.push({
        id: 'r' + (idCounter++),
        sem: r[0],
        name: r[1],
        linea: r[2],
        prereqs: r[3] || [],
        area,
        electivo: r[4] || false,
        certificacion: r[5] || false,
      });
    });
  };

  addArea('disciplinar', MALLA.disciplinar);
  addArea('basica', MALLA.basica);
  addArea('electiva', MALLA.electiva);
}

buildRamos();

const TOTAL = ALL_RAMOS.length;
const approved = new Set(JSON.parse(localStorage.getItem('malla_ap_approved') || '[]'));

function save() { try { localStorage.setItem('malla_ap_approved', JSON.stringify([...approved])); } catch(e) {} }

function updateStats() {
  const done = approved.size;
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('pill-total').textContent = `${TOTAL} ramos`;
  document.getElementById('pill-done').textContent = `${done} aprobados`;
  document.getElementById('pill-avance').textContent = `${pct}% completado`;
  document.getElementById('pm-fill').style.width = pct + '%';
  document.getElementById('pm-pct').textContent = pct + '%';
}

function resetAll() {
  if (!confirm('¿Reiniciar toda la malla?')) return;
  approved.clear(); save(); render();
}

function aprobarHastaSemestre() {
  // Approve all ramos of first non-fully-approved semester
  for (let s = 1; s <= 10; s++) {
    const ramosS = ALL_RAMOS.filter(r => r.sem === s);
    if (ramosS.some(r => !approved.has(r.id))) {
      ramosS.forEach(r => approved.add(r.id));
      save(); render(); return;
    }
  }
}

function toggleRamo(id) {
  if (approved.has(id)) approved.delete(id);
  else approved.add(id);
  save(); render();
}

function render() {
  const wrapper = document.getElementById('malla-wrapper');
  wrapper.innerHTML = '';

  // ── Semester headers ──────────────────────────────────────────────────────
  const headersRow = document.createElement('div');
  headersRow.className = 'sem-headers';
  headersRow.style.minWidth = 'fit-content';

  // spacer for area label
  const sp = document.createElement('div');
  sp.style.minWidth = '28px';
  headersRow.appendChild(sp);

  for (let s = 1; s <= 10; s++) {
    const cell = document.createElement('div');
    cell.className = 'sem-header-cell';
    cell.style.borderColor = SEM_COLORS[s] + '80';
    const ciclo = s <= 8 ? 1 : 2;
    cell.innerHTML = `
      <div style="margin-bottom:3px"><span class="ciclo-badge ciclo-${ciclo}">Ciclo ${ciclo}</span></div>
      <div class="sem-num" style="color:${SEM_COLORS[s]}">${s}°</div>
      <div class="sem-sub">Semestre</div>
    `;
    headersRow.appendChild(cell);
  }
  wrapper.appendChild(headersRow);

  // ── Areas ─────────────────────────────────────────────────────────────────
  const AREAS = [
    { key: 'disciplinar', label: 'Área Formación Disciplinar', labelClass: 'area-label-disciplinar', borderColor: 'var(--gestion)' },
    { key: 'basica',      label: 'Área Formación Básica',      labelClass: 'area-label-basica',       borderColor: 'var(--basica)' },
    { key: 'electiva',    label: 'Área Formación Electiva',    labelClass: 'area-label-electiva',     borderColor: 'var(--electiva)' },
  ];

  AREAS.forEach(area => {
    const block = document.createElement('div');
    block.className = 'area-block';
    block.style.minWidth = 'fit-content';

    // Area label
    const aLabel = document.createElement('div');
    aLabel.className = `area-label ${area.labelClass}`;
    aLabel.style.borderColor = area.borderColor;
    aLabel.textContent = area.label;
    block.appendChild(aLabel);

    // Grid of 10 semester columns
    const grid = document.createElement('div');
    grid.className = 'sems-grid';

    for (let s = 1; s <= 10; s++) {
      const col = document.createElement('div');
      col.className = 'sem-col';

      const ramosS = ALL_RAMOS.filter(r => r.area === area.key && r.sem === s);

      if (ramosS.length === 0) {
        // Empty col placeholder
        col.appendChild(document.createElement('div'));
      }

      ramosS.forEach(ramo => {
        const card = document.createElement('div');
        card.className = 'ramo-card';
        if (ramo.electivo) card.classList.add('electivo');
        if (ramo.certificacion) card.classList.add('certificacion');
        if (approved.has(ramo.id)) card.classList.add('done');

        const lineColor = LINEA_COLORS[ramo.linea] || '#7b8fa0';
        card.style.borderLeftColor = lineColor;

        card.innerHTML = `
          <div class="ramo-name">${ramo.name}</div>
          <div>
            <div class="ramo-linea" style="color:${lineColor}88">${LINEA_LABELS[ramo.linea] || ''}</div>
            ${ramo.electivo ? '<span class="tag tag-electivo">Electivo</span>' : ''}
            ${ramo.certificacion ? '<span class="tag tag-cert">Certificación</span>' : ''}
          </div>
        `;

        // Click
        card.addEventListener('click', () => toggleRamo(ramo.id));

        // Tooltip
        card.addEventListener('mousemove', e => {
          const tip = document.getElementById('tooltip');
          tip.innerHTML = `
            <strong>${ramo.name}</strong>
            <div class="tip-row">Semestre: <span>${ramo.sem}°</span></div>
            <div class="tip-row">Línea: <span>${LINEA_LABELS[ramo.linea] || '-'}</span></div>
            <div class="tip-row">Estado: <span>${approved.has(ramo.id) ? '✓ Aprobado' : 'Pendiente'}</span></div>
            <div class="tip-row" style="margin-top:6px;color:#e8a02088;font-size:0.58rem">Prerrequisitos se agregarán pronto</div>
          `;
          tip.classList.add('visible');
          tip.style.left = (e.clientX + 14) + 'px';
          tip.style.top  = (e.clientY - 54) + 'px';
        });
        card.addEventListener('mouseleave', () => {
          document.getElementById('tooltip').classList.remove('visible');
        });

        col.appendChild(card);
      });

      grid.appendChild(col);
    }

    block.appendChild(grid);
    wrapper.appendChild(block);
  });

  updateStats();
}

render();
</script>
</body>
</html>
